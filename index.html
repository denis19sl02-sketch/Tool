<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLYGLOT IDE - FRONTEND (OFFLINE)</title>
    <style>
        /* [css.3] Встроенные стили империи */
        * { box-sizing: border-box; font-family: 'Courier New', monospace; }
        body { 
            background: #000000; 
            color: #00d2ff; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            gap: 20px;
            min-height: 100vh;
        }
        .calc-block {
            background: #000000;
            border: 2px solid #00d2ff;
            border-radius: 10px;
            padding: 20px;
            width: 320px;
            box-shadow: 0 0 20px #00d2ff, inset 0 0 5px #00d2ff;
        }
        h3 {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #00d2ff;
        }
        .screen {
            background: #000000;
            border: 1px solid #00d2ff;
            color: #00d2ff;
            padding: 12px;
            text-align: right;
            min-height: 50px;
            margin-bottom: 15px;
            font-size: 1.3rem;
            word-break: break-all;
            text-shadow: 0 0 8px #00d2ff;
            box-shadow: inset 0 0 5px #00d2ff;
        }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button {
            background: #000000;
            border: 1px solid #00d2ff;
            color: #00d2ff;
            padding: 12px 0;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s ease;
            text-shadow: 0 0 3px #00d2ff;
        }
        button:hover { background: #00d2ff; color: #000; box-shadow: 0 0 12px #00d2ff; text-shadow: none; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- [3.html] Интерфейс логического калькулятора -->
    <div class="calc-block">
        <h3>BOOLEAN LOGIC</h3>
        <div class="screen" id="logic-screen">0</div>
        <div class="grid">
            <button onclick="pressLogic('1')">1</button>
            <button onclick="pressLogic('0')">0</button>
            <button onclick="pressLogic('AND')">AND</button>
            <button onclick="pressLogic('OR')">OR</button>
            <button onclick="pressLogic('NOT')">NOT</button>
            <button onclick="pressLogic('XOR')">XOR</button>
            <button onclick="pressLogic('->')">-&gt;</button>
            <button onclick="pressLogic('<->')">&lt;-&gt;</button>
            <button onclick="clearLogic()" style="grid-column: span 2; color: #ff0055; border-color: #ff0055; text-shadow: 0 0 3px #ff0055;">C</button>
            <button onclick="runLogic()" style="grid-column: span 2;">=</button>
        </div>
    </div>

    <!-- [x.html] Интерфейс математического калькулятора -->
    <div class="calc-block">
        <h3>MATH KEYBOARD</h3>
        <div class="screen" id="math-screen">0</div>
        <div class="grid">
            <button onclick="pressMath('7')">7</button>
            <button onclick="pressMath('8')">8</button>
            <button onclick="pressMath('9')">9</button>
            <button onclick="pressMath('/')">÷</button>
            
            <button onclick="pressMath('4')">4</button>
            <button onclick="pressMath('5')">5</button>
            <button onclick="pressMath('6')">6</button>
            <button onclick="pressMath('*')">×</button>
            
            <button onclick="pressMath('1')">1</button>
            <button onclick="pressMath('2')">2</button>
            <button onclick="pressMath('3')">3</button>
            <button onclick="pressMath('-')">-</button>
            
            <button onclick="pressMath('0')">0</button>
            <button onclick="clearMath()" style="color: #ff0055; border-color: #ff0055; text-shadow: 0 0 3px #ff0055;">C</button>
            <button onclick="runMath()">=</button>
            <button onclick="pressMath('+')">+</button>
        </div>
    </div>

    <script>
        // [python.1] Ядро базовой логики
        function calculateBasicLogic(op, a, b) {
            if (op === 'NOT') return !a ? 1 : 0;
            if (op === 'AND') return (a && b) ? 1 : 0;
            if (op === 'OR')  return (a || b) ? 1 : 0;
            return 0;
        }

        // [python.2] Ядро расширенной логики
        function calculateAdvancedLogic(op, a, b) {
            if (op === 'XOR') return (a !== b) ? 1 : 0;
            if (op === '->')  return (!a || b) ? 1 : 0;
            if (op === '<->') return (a === b) ? 1 : 0;
            return 0;
        }

        // Логика управления экраном 3.html
        let logicExpr = "";
        function pressLogic(val) { 
            logicExpr += val + " "; 
            document.getElementById('logic-screen').innerText = logicExpr; 
        }
        function clearLogic() { 
            logicExpr = ""; 
            document.getElementById('logic-screen').innerText = "0"; 
        }
        function runLogic() {
            try {
                let parts = logicExpr.trim().split(/\s+/);
                if(parts[0] === 'NOT') {
                    let a = parseInt(parts[1]);
                    document.getElementById('logic-screen').innerText = calculateBasicLogic('NOT', a);
                } else {
                    let a = parseInt(parts[0]);
                    let op = parts[1];
                    let b = parseInt(parts[2]);
                    let res = (['AND','OR'].includes(op)) ? calculateBasicLogic(op, a, b) : calculateAdvancedLogic(op, a, b);
                    document.getElementById('logic-screen').innerText = res;
                }
                logicExpr = "";
            } catch(e) { 
                document.getElementById('logic-screen').innerText = "ERR"; 
                logicExpr = ""; 
            }
        }

        // Логика управления экраном x.html
        let mathExpr = "";
        function pressMath(val) { 
            mathExpr += val; 
            document.getElementById('math-screen').innerText = mathExpr; 
        }
        function clearMath() { 
            mathExpr = ""; 
            document.getElementById('math-screen').innerText = "0"; 
        }
        function runMath() {
            try {
                // Безопасное вычисление строки математики
                let result = new Function('"use strict"; return (' + mathExpr + ')')();
                document.getElementById('math-screen').innerText = result !== undefined ? result : "0";
                mathExpr = "";
            } catch(e) { 
                document.getElementById('math-screen').innerText = "ERR"; 
                mathExpr = ""; 
            }
        }
    </script>
</body>
</html>
