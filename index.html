<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLYGLOT IDE - FRONTEND</title>
    <link rel="stylesheet" href="css.3">
</head>
<body style="background-color: #000; color: #00d2ff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;">

    <div id="app-logic"></div>
    <div id="app-keyboard"></div>

    <script>
        function loadScriptModule(fileName) {
            return fetch(fileName)
                .then(r => r.text())
                .then(text => {
                    let script = document.createElement('script');
                    script.text = text;
                    document.body.appendChild(script);
                });
        }

        function loadHtmlModule(fileName, containerId) {
            return fetch(fileName)
                .then(r => r.text())
                .then(htmlText => {
                    let parser = new DOMParser();
                    let doc = parser.parseFromString(htmlText, 'text/html');
                    let tempDiv = document.createElement('div');
                    tempDiv.innerHTML = doc.body ? doc.body.innerHTML : htmlText;
                    
                    let scripts = tempDiv.querySelectorAll('script');
                    scripts.forEach(s => s.remove());
                    
                    document.getElementById(containerId).innerHTML = tempDiv.innerHTML;

                    doc.querySelectorAll('script').forEach(oldScript => {
                        let newScript = document.createElement('script');
                        newScript.text = oldScript.text;
                        document.body.appendChild(newScript);
                    });
                });
        }

        // Загружаем всё по очереди
        Promise.all([
            loadScriptModule('python.1'),
            loadScriptModule('python.2')
        ])
        .then(() => loadHtmlModule('3.html', 'app-logic'))
        .then(() => loadHtmlModule('x.html', 'app-keyboard'))
        .then(() => console.log('СИСТЕМА ДЕНИСИЯ ИНТЕГРИРОВАНА!'))
        .catch(err => console.error('Ошибка загрузки файлов компонент:', err));
    </script>
</body>
</html>
